services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env.local
    command: pnpm --filter @routax/web dev --hostname 0.0.0.0 --port 3000
    volumes:
      - ../..:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routax_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-routax}
    volumes:
      - routax-postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routax} -d ${POSTGRES_DB:-routax}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-routax_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-routax_minio_secret}
    volumes:
      - routax-minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-routax_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-routax_minio_secret}
    volumes:
      - ./minio/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5

  graphhopper:
    image: israelhikingmap/graphhopper:11.0
    restart: unless-stopped
    environment:
      JAVA_OPTS: "${GH_JAVA_OPTS:--Xmx2g -Xms256m}"
    command: --host 0.0.0.0
    volumes:
      - ./graphhopper/config.yml:/graphhopper/config-example.yml:ro
      - ./graphhopper/custom_models:/graphhopper/custom_models:ro
      - ./graphhopper/data:/data
      - graphhopper-elevation:/data/elevation-cache
    ports:
      - "${GH_PORT:-8989}:8989"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/info"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env.local
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-routax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routax_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-routax}
      GRAPHHOPPER_URL: http://graphhopper:8989
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-routax_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-routax_minio_secret}
      MAILHOG_HOST: mailhog
      MAILHOG_SMTP_PORT: 1025
      API_PORT: 3001
      ROUTAX_CORS_ALLOWLIST: https://localhost,https://routax.cc
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      graphhopper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -zw3 127.0.0.1 443 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  routax-postgres-data:
  routax-minio-data:
  caddy-data:
  caddy-config:
  graphhopper-elevation:
